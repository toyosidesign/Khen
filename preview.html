<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/favicon-32.png?v=5" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/favicon-192.png?v=5" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=5" />
  <title>Preview Template Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:#444ce7; --brand-hover:#3538cd;
      --n-0:#fff; --n-50:#f9fafb; --n-100:#f2f4f7; --n-200:#eaecf0; --n-300:#d0d5dd;
      --n-500:#667085; --n-600:#475467; --n-700:#344054; --n-900:#101828;
      --topbar-h:64px;
      --font:"Inter", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--font); color: var(--n-900); background: var(--n-100); overflow: hidden; }
    a { text-decoration: none; color: inherit; }

    /* ---- top bar ---- */
    .topbar {
      height: var(--topbar-h); background: var(--n-0); border-bottom: 1px solid var(--n-200);
      display: flex; align-items: center; gap: 16px; padding: 0 20px; position: relative; z-index: 10;
    }
    .tb-left, .tb-right { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
    .tb-right { justify-content: flex-end; }
    .back { display: inline-flex; align-items: center; gap: 8px; color: var(--n-600); font-weight: 600; font-size: 14px; padding: 8px 10px; border-radius: 8px; }
    .back:hover { background: var(--n-50); color: var(--n-900); }
    .meta { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .meta .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta .cat { font-size: 12px; color: var(--n-500); }

    /* device toggle (center) */
    .devices { display: inline-flex; background: var(--n-100); border: 1px solid var(--n-200); border-radius: 10px; padding: 3px; gap: 2px; }
    .devices button {
      display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 600; color: var(--n-600); padding: 7px 12px; border-radius: 7px;
    }
    .devices button:hover { color: var(--n-900); }
    .devices button.active { background: var(--n-0); color: var(--brand); box-shadow: 0 1px 2px rgba(16,24,40,.1); }
    .devices svg { width: 16px; height: 16px; }

    .price { font-weight: 700; font-size: 15px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; font-family: inherit; font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
    .btn-ghost { background: var(--n-0); border-color: var(--n-300); color: var(--n-700); }
    .btn-ghost:hover { background: var(--n-50); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-hover); }

    /* ---- stage ---- */
    .stage { height: calc(100% - var(--topbar-h)); display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }

    /* desktop: fluid frame that fills the stage */
    .frame { position: relative; background: var(--n-0); width: 100%; max-width: 1440px; height: 100%; box-shadow: 0 12px 40px -12px rgba(16,24,40,.18); overflow: hidden; flex: none; transform-origin: center center; transition: transform .35s cubic-bezier(.4,0,.2,1); }
    .frame iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

    /* Holds the iframe + watermark so the overlay aligns to the screen area,
       not the device bezel (absolute `inset:0` resolves to the padding box). */
    .viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }

    /* Tiled diagonal watermark, drawn in THIS document rather than inside the
       previewed page — saving the iframe source does not carry it along. */
    .watermark { position: absolute; inset: 0; z-index: 2; pointer-events: none; background-repeat: repeat; }

    /* tablet: iPad-style mockup — fixed 834px logical viewport, scaled to fit via JS */
    .frame.tablet { width: 834px; height: 1120px; max-width: none; background: #1d2939; padding: 32px; border-radius: 42px; box-shadow: 0 40px 70px -24px rgba(16,24,40,.5); overflow: visible; }
    .frame.tablet iframe, .frame.tablet .viewport { border-radius: 18px; }
    .frame.tablet::after { content: ""; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #3a4353; }

    /* mobile: iPhone-style mockup — fixed 390px logical viewport, scaled to fit via JS */
    .frame.mobile { width: 390px; height: 844px; max-width: none; background: #1d2939; padding: 20px; border-radius: 56px; box-shadow: 0 40px 70px -22px rgba(16,24,40,.55); overflow: visible; }
    .frame.mobile iframe, .frame.mobile .viewport { border-radius: 44px; }
    .frame.mobile::after { content: ""; position: absolute; top: 26px; left: 50%; transform: translateX(-50%); width: 100px; height: 30px; background: #000; border-radius: 16px; z-index: 3; }

    .loading { position: absolute; inset: var(--topbar-h) 0 0 0; display: grid; place-items: center; color: var(--n-500); font-size: 14px; pointer-events: none; transition: opacity .3s; }
    .loading.hide { opacity: 0; }

    /* toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--n-900); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; box-shadow: 0 12px 32px -8px rgba(0,0,0,.4); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 800px) {
      .tb-left .meta { display: none; }
      .devices button span { display: none; }
      .devices button { padding: 8px 10px; }
      .stage { padding: 12px; }
      .btn-ghost { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="tb-left">
      <a class="back" href="./projects.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Projects
      </a>
    </div>

    <div class="devices" id="devices">
      <button data-w="desktop" class="active" title="Desktop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span>Desktop</span>
      </button>
      <button data-w="tablet" title="Tablet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
        <span>Tablet</span>
      </button>
      <button data-w="mobile" title="Mobile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18h.01"/></svg>
        <span>Mobile</span>
      </button>
    </div>

    <div class="tb-right">
      <span class="price" id="tplPrice"></span>
      <a class="btn btn-primary" href="./#contact">Start a similar project →</a>
    </div>
  </header>

  <div class="loading" id="loading">Loading preview…</div>

  <div class="stage">
    <div class="frame" id="frame">
      <div class="viewport" id="viewport">
        <iframe id="viewer" title="Template preview" loading="lazy"></iframe>
        <div class="watermark" id="watermark" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ---- Preview watermark -------------------------------------------------
    // Change this one string to rebrand the overlay everywhere.
    const WATERMARK_TEXT = "PREVIEW · TEMPLATE PLATFORM";

    const xmlEscape = (s) => s.replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));

    // One tile carries two staggered labels so the repeat reads as a diagonal
    // lattice. Each label is drawn twice — a white pass 1px below a dark pass —
    // so it stays legible over light AND dark sections of a template.
    function watermarkTile(text) {
      const W = 440, H = 280;
      const safe = xmlEscape(text);
      const label = (x, y) => `
        <g transform="rotate(-30 ${x} ${y})" text-anchor="middle"
           font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">
          <text x="${x}" y="${y + 1}" fill="#ffffff" fill-opacity="0.11">${safe}</text>
          <text x="${x}" y="${y}" fill="#101828" fill-opacity="0.10">${safe}</text>
        </g>`;
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">` +
        label(W * 0.25, H * 0.25) + label(W * 0.75, H * 0.75) +
        `</svg>`;
      return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    }

    const viewport = document.getElementById("viewport");
    let watermark = document.getElementById("watermark");
    watermark.style.backgroundImage = watermarkTile(WATERMARK_TEXT);

    // A speed bump, not a lock: anyone with DevTools can still strip this, but
    // deleting the node no longer survives long enough to line up a screenshot.
    new MutationObserver(() => {
      if (!watermark.isConnected) {
        watermark = watermark.cloneNode(false);
        watermark.style.backgroundImage = watermarkTile(WATERMARK_TEXT);
        viewport.appendChild(watermark);
      }
    }).observe(viewport, { childList: true });
    // ------------------------------------------------------------------------

    const params = new URLSearchParams(location.search);
    // Previews only. `templates/` holds the full deliverables and is not deployed.
    const requested = params.get("src") || "previews/khen-analytics.html";
    const src = requested.startsWith("previews/") ? requested : "previews/" + requested.replace(/^.*\//, "");
    const name  = params.get("name")  || "Template preview";
    const cat   = params.get("cat")   || "Template Platform";
    const price = params.get("price") || "";

    document.getElementById("tplPrice").textContent = price;
    document.title = "Preview " + name;

    const viewer = document.getElementById("viewer");
    viewer.src = src;

    const loading = document.getElementById("loading");
    const frame = document.getElementById("frame");
    const stage = document.querySelector(".stage");

    // Scale the fixed-size device mockups down to fit the available stage.
    function fitDevice() {
      if (frame.classList.contains("tablet") || frame.classList.contains("mobile")) {
        const scale = Math.min(1, (stage.clientHeight - 40) / frame.offsetHeight, (stage.clientWidth - 40) / frame.offsetWidth);
        frame.style.transform = "scale(" + scale + ")";
      } else {
        frame.style.transform = "none";
      }
    }
    window.addEventListener("resize", fitDevice);
    viewer.addEventListener("load", () => { loading.classList.add("hide"); fitDevice(); });

    // device toggle
    document.getElementById("devices").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      document.querySelectorAll("#devices button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      frame.classList.remove("tablet", "mobile");
      const w = btn.dataset.w;
      if (w !== "desktop") frame.classList.add(w);
      fitDevice();
    });
    fitDevice();

  </script>
</body>
</html>
