<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folio Personal · Template Platform</title>
  <meta name="description" content="Minimal portfolio with project gallery and about section." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Folio Personal · Template Platform" />
  <meta property="og:description" content="Minimal portfolio with project gallery and about section." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:#444ce7; --brand-hover:#3538cd;
      --n-0:#fff; --n-50:#f9fafb; --n-100:#f2f4f7; --n-200:#eaecf0; --n-300:#d0d5dd;
      --n-400:#98a2b3; --n-500:#667085; --n-600:#475467; --n-700:#344054; --n-900:#101828;
      --font:"Inter", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); color: var(--n-900); min-height: 100vh;
      display: grid; place-items: center; padding: 24px;
      background:
        radial-gradient(60% 50% at 15% 0%, #1e293b22, transparent 70%),
        radial-gradient(55% 45% at 100% 100%, #0f172a22, transparent 70%),
        var(--n-50);
    }
    a { text-decoration: none; color: inherit; }
    .back {
      position: fixed; top: 20px; left: 20px; display: inline-flex; align-items: center; gap: 8px;
      color: var(--n-600); font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 8px;
      background: rgba(255,255,255,.7); backdrop-filter: blur(6px);
    }
    .back:hover { background: var(--n-0); color: var(--n-900); }
    .card {
      background: var(--n-0); border: 1px solid var(--n-200); border-radius: 20px;
      max-width: 520px; width: 100%; padding: 48px 40px; text-align: center;
      box-shadow: 0 24px 60px -20px rgba(16,24,40,.18);
    }
    .glyph {
      width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 24px;
      background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff;
      display: grid; place-items: center; font-size: 32px; font-weight: 800;
      box-shadow: 0 10px 24px -8px #1e293b88;
    }
    .status {
      display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600;
      color: #b54708; background: #fffaeb; border: 1px solid #fedf89; padding: 5px 12px; border-radius: 999px;
      margin-bottom: 18px;
    }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f79009; }
    h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 10px; }
    .tag { color: var(--brand); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 14px; }
    .desc { color: var(--n-500); font-size: 16px; line-height: 1.6; max-width: 380px; margin: 0 auto 24px; }
    .price { font-weight: 700; font-size: 18px; margin-bottom: 28px; }
    .price span { color: var(--n-400); font-weight: 500; font-size: 14px; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; font-family: inherit; font-weight: 600;
      font-size: 15px; padding: 12px 22px; border-radius: 10px; cursor: pointer; border: 1px solid transparent;
    }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-ghost { background: var(--n-0); border-color: var(--n-300); color: var(--n-700); }
    .btn-ghost:hover { background: var(--n-50); }
    .foot { margin-top: 28px; font-size: 13px; color: var(--n-400); }
    @media (max-width: 480px) { .card { padding: 36px 22px; } h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <a class="back" href="../index.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Templates
  </a>

  <main class="card">
    <div class="glyph">F</div>
    <div class="status">Coming soon</div>
    <p class="tag">Portfolio</p>
    <h1>Folio Personal</h1>
    <p class="desc">Minimal portfolio with project gallery and about section.</p>
    <p class="price">$39 <span>one-time</span></p>
    <div class="actions">
      <a class="btn btn-primary" href="../index.html">Browse templates</a>
      <a class="btn btn-ghost" href="./khen-analytics.html">See a live example</a>
    </div>
    <p class="foot">This template is in the works. Check back soon.</p>
  </main>
</body>
</html>
