<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khen — Product Development Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ---- Design tokens (mirrors @tp/tokens) ---- */
    :root {
      --brand-500:#2f66f5; --brand-600:#1d4ed8; --brand-700:#1b3fb0;
      --n-50:#f8fafc; --n-200:#e2e8f0; --n-600:#475569; --n-900:#0f172a;
      --font-display:"Space Grotesk", system-ui, sans-serif;
      --font-body:"Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body); color: var(--n-900); background: var(--n-50);
      -webkit-font-smoothing: antialiased; line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }

    /* ---- Top bar ---- */
    .topbar { border-bottom: 1px solid var(--n-200); background: #fff; }
    .topbar-inner {
      max-width: 1200px; margin: 0 auto; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
    .logo-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
    }
    .cta {
      display: inline-block; background: var(--brand-500); color: #fff; padding: 12px 20px;
      border-radius: 10px; font-weight: 600; font-size: 15px; transition: background .15s ease;
    }
    .cta:hover { background: var(--brand-600); }

    /* ---- Hero (placeholder until agency content lands) ---- */
    .hero { max-width: 880px; margin: 0 auto; padding: 120px 24px; text-align: center; }
    .hero h1 { font-family: var(--font-display); font-size: clamp(36px, 6vw, 60px); line-height: 1.1; letter-spacing: -.02em; }
    .hero p { margin: 20px auto 32px; max-width: 560px; color: var(--n-600); font-size: 18px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="./index.html"><span class="logo-mark">k</span> Khen</a>
      <nav><a class="cta" href="./projects.html">All projects</a></nav>
    </div>
  </header>

  <main class="hero">
    <h1>Khen — product development agency</h1>
    <p>Placeholder homepage. Agency content goes here.</p>
    <a class="cta" href="./projects.html">See our projects</a>
  </main>
</body>
</html>
